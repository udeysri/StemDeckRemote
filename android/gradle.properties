org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 8.7.3 predates official compileSdk 36 support (needed for Play's API
# level requirement) but builds fine against it — this just silences the
# "not tested" warning rather than blocking on an AGP upgrade.
android.suppressUnsupportedCompileSdk=36
